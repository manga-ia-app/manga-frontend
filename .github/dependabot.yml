# Gerado pelo manga-infra (Fase 2). Atualizações semanais, agrupadas para reduzir PRs.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      timezone: "America/Bahia"
    open-pull-requests-limit: 5
    groups:
      menores:
        update-types: ["minor", "patch"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      actions:
        patterns: ["*"]
